faq.kicker=FREQUENTLY ASKED QUESTIONS
faq.titulo=Before booking
foot.p1=© 2026 MedCare · Patient management system
foot.p2=Academic mock-up · Fictitious data
faq.1q=Is the appointment confirmed instantly?
faq.2q=How do I see my appointment after booking?
faq.3q=What are the opening hours?
faq.4q=Can I cancel or change my appointment?
faq.5q=How far ahead can I book?
faq.6q=Is this real data?
faq.1a=It stays <b>Pending</b> until the clinic confirms it. You can see its status in your patient portal.
faq.2a=Go to <b>Patient login</b> using your ID number as username. If this is your first booking, your initial password is your ID number and the system will ask you to change it.
faq.3a=Each doctor has their own days and hours (shown on their card). When you pick a doctor and date, only free slots appear.
faq.4a=Yes. From your patient portal you can reschedule or cancel up to 2 hours before. If you left your email, we notify you of the change.
faq.5a=From 1 hour before the appointment and up to 30 days ahead.
faq.6a=No. MedCare is an academic mock-up: doctors, patients and appointments are fictitious. Do not enter real personal data.
