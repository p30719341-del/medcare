spring.application.name=medcare
spring.thymeleaf.cache=false
# Consola de la base de datos (solo para uso local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Armar toda la página en memoria antes de enviarla (evita "Cannot create a session after the response has been committed")
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
spring.web.locale=es_PE
spring.messages.fallback-to-system-locale=false
server.port=${PORT:8080}

# ---------------- Base de datos ----------------
# Por defecto: H2 en un ARCHIVO local (./data/medcare.mv.db). No necesitas instalar nada y los datos se conservan.
# Para usar MySQL:  mvn spring-boot:run -Dspring-boot.run.profiles=mysql   (ver application-mysql.properties)
# En internet (Docker/Render/etc.) se puede apuntar a otra base con las variables DB_URL, DB_USER y DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/medcare;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# ---------------- Correo de confirmación ----------------
# false = el correo NO se envía: se escribe en la consola ("[CORREO SIMULADO]") para que veas qué se enviaría.
medcare.mail.enabled=false
medcare.mail.from=no-reply@medcare.local
# Para enviar de verdad con Gmail: pon enabled=true, activa la verificación en 2 pasos de tu cuenta,
# crea una "contraseña de aplicación" y descomenta estas líneas (no subas tu contraseña a GitHub):
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=tu_correo@gmail.com
# spring.mail.password=tu_contraseña_de_aplicación
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ---------------- Archivos (exámenes) ----------------
# Los exámenes se guardan en la base de datos (máximo 3 MB cada uno); el límite del servidor debe ser un poco mayor.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# ---------------- Enlaces públicos y copias de seguridad ----------------
# Dirección pública de la app: va dentro del QR de la receta y en los correos. En internet pon la tuya (ej. https://medcare.onrender.com).
medcare.base-url=${BASE_URL:http://localhost:${server.port}}
# Recordatorios por correo 24 h antes (cada hora) y copia de seguridad diaria (solo con H2)
medcare.recordatorios.enabled=true
medcare.backup.enabled=true
medcare.backup.dir=${BACKUP_DIR:./data/respaldos}

# Detrás de un proxy HTTPS (Render, Railway, Docker): respeta https y marca la cookie de sesión como segura
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# ---------------- Servicios reales (todo apagado por defecto: solo se simulan en la consola) ----------------
# Correo del administrador: recibe el aviso de cada cita nueva y el correo de prueba del panel "Estado del sistema".
medcare.admin.email=${ADMIN_EMAIL:}
# Correo SMTP sin tocar este archivo (útil en Render/Railway): MEDCARE_MAIL_ENABLED=true, SPRING_MAIL_HOST, SPRING_MAIL_PORT=587,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true, SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
# WhatsApp Business Cloud API (Meta). Requiere cuenta, token y una plantilla aprobada con 4 variables (nombre, doctor, fecha, hora).
medcare.whatsapp.enabled=${WHATSAPP_ENABLED:false}
medcare.whatsapp.token=${WHATSAPP_TOKEN:}
medcare.whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
medcare.whatsapp.template=${WHATSAPP_TEMPLATE:recordatorio_cita}
medcare.whatsapp.lang=${WHATSAPP_LANG:es}
# Pagos: simulado (recepción marca "cobrado") o yape (el paciente ve el número de Yape/Plin y recepción confirma el pago).
medcare.pagos.modo=${PAGOS_MODO:simulado}
medcare.pagos.yape-numero=${YAPE_NUMERO:}
medcare.pagos.yape-titular=${YAPE_TITULAR:}
