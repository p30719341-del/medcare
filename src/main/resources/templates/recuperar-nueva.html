<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedCare | Nueva contraseña</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232864e8'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" th:href="@{/styles.css}"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2864e8"><link rel="apple-touch-icon" href="/img/icon-192.png"><script>(function(){var R=document.documentElement;try{var t=localStorage.getItem('medcare-tema');if(t)R.setAttribute('data-theme',t)}catch(e){}function sync(){var d=R.getAttribute('data-theme')==='dark';var b=document.querySelectorAll('[data-theme-toggle]');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',String(d));var s=b[i].querySelector('span');if(s)s.textContent=d?'Modo claro':'Modo oscuro'}}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-toggle]');if(!b)return;var n=R.getAttribute('data-theme')==='dark'?'light':'dark';R.setAttribute('data-theme',n);try{localStorage.setItem('medcare-tema',n)}catch(x){}sync()});document.addEventListener('DOMContentLoaded',sync)})()</script></head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<section class="auth-form solo-page" id="contenido">
  <form class="dialog solo" th:if="${valido}" th:action="@{/recuperar/{t}(t=${token})}" method="post">
    <div class="brand"><b>✚</b><span><strong>MedCare</strong><small>Gestión clínica</small></span></div>
    <small class="kicker">SEGURIDAD</small>
    <h2>Crea tu nueva contraseña</h2>
    <div class="alert" role="alert" th:each="e : ${errores}" th:text="${e}">Error</div>
    <label for="nueva">Contraseña nueva</label>
    <input id="nueva" name="nueva" type="password" required minlength="8" autocomplete="new-password" autofocus>
    <small class="hint">Mínimo 8 caracteres, con al menos una letra y un número.</small>
    <label for="confirmar">Repite la contraseña nueva</label>
    <input id="confirmar" name="confirmar" type="password" required minlength="8" autocomplete="new-password">
    <button class="primary">Guardar contraseña</button>
  </form>
  <div class="dialog solo" th:unless="${valido}">
    <div class="brand"><b>✚</b><span><strong>MedCare</strong><small>Gestión clínica</small></span></div>
    <h2>Enlace no válido</h2>
    <div class="alert" role="alert"><span th:each="e : ${errores}" th:text="${e}"></span><span th:if="${errores == null}">El enlace venció o ya se usó.</span></div>
    <a class="primary" style="display:block;text-align:center;text-decoration:none;line-height:46px" th:href="@{/recuperar}">Pedir un enlace nuevo</a>
  </div>
</section>
<script th:src="@{/script.js}"></script>
</body>
</html>
