<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedCare | Calendario semanal</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232864e8'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" th:href="@{/styles.css}"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2864e8"><link rel="apple-touch-icon" href="/img/icon-192.png"><script>(function(){var R=document.documentElement;try{var t=localStorage.getItem('medcare-tema');if(t)R.setAttribute('data-theme',t)}catch(e){}function sync(){var d=R.getAttribute('data-theme')==='dark';var b=document.querySelectorAll('[data-theme-toggle]');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',String(d));var s=b[i].querySelector('span');if(s)s.textContent=d?'Modo claro':'Modo oscuro'}}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-toggle]');if(!b)return;var n=R.getAttribute('data-theme')==='dark'?'light':'dark';R.setAttribute('data-theme',n);try{localStorage.setItem('medcare-tema',n)}catch(x){}sync()});document.addEventListener('DOMContentLoaded',sync)})()</script></head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<aside th:replace="~{fragments :: sidebarAdmin('calendario')}"></aside>
<main id="contenido">
<header>
  <div class="crumb"><button th:replace="~{fragments :: menuBtn}"></button><span>Citas　/　<strong>Calendario</strong></span></div>
  <span id="today"></span>
</header>

<section class="heading">
  <div><small class="kicker">AGENDA SEMANAL</small><h1>Calendario</h1>
    <p th:text="|Semana del ${#temporals.format(lunes,'dd MMM')} al ${#temporals.format(sabado,'dd MMM yyyy')} · ${total} citas|">Semana</p></div>
  <div class="weeknav">
    <a class="secondary" th:href="@{/admin/calendario(semana=${anterior},doctor=${doctor})}" aria-label="Semana anterior">← Anterior</a>
    <a class="secondary" th:href="@{/admin/calendario(semana=${estaSemana},doctor=${doctor})}">Esta semana</a>
    <a class="secondary" th:href="@{/admin/calendario(semana=${siguiente},doctor=${doctor})}" aria-label="Semana siguiente">Siguiente →</a>
  </div>
</section>

<article class="panel">
  <form class="tools" method="get" th:action="@{/admin/calendario}">
    <input type="hidden" name="semana" th:value="${lunes}">
    <select name="doctor" aria-label="Filtrar por doctor" onchange="this.form.submit()">
      <option value="">Todos los doctores</option>
      <option th:each="d : ${doctores}" th:value="${d.nombre}" th:text="${d.nombre}" th:selected="${d.nombre == doctor}">Dr. Ramírez</option>
    </select>
    <noscript><button class="secondary">Filtrar</button></noscript>
  </form>
  <div class="legend"><span class="ev wait">Pendiente</span><span class="ev ok">Confirmada o atendida</span></div>
  <div class="cal-scroll"><div class="cal" role="table" aria-label="Calendario semanal de citas">
    <div class="cal-row cal-head" role="row">
      <div role="columnheader"><span class="sr-only">Hora</span></div>
      <div role="columnheader" th:each="d : ${dias}" th:classappend="${d == hoy} ? 'hoy'"><span th:text="${#temporals.format(d,'EEEE')}">lunes</span><b th:text="${#temporals.format(d,'dd')}">12</b></div>
    </div>
    <div class="cal-row" role="row" th:each="f : ${filas}">
      <div class="cal-hora" role="rowheader" th:text="${#temporals.format(f.hora,'HH:mm')}">08:00</div>
      <div class="cal-celda" role="cell" th:each="celda : ${f.celdas}">
        <div class="ev" th:each="c : ${celda}" th:classappend="${c.claseEstado}" th:title="|${c.paciente.name} · ${c.especialidad} · ${c.estado}|">
          <b th:text="${c.paciente.name}">Paciente</b><small th:text="${c.doctor}">Doctor</small>
        </div>
      </div>
    </div>
  </div></div>
</article>

<footer class="bottom">© 2026 MedCare · Sistema de gestión de pacientes <span>Maqueta académica · Datos ficticios</span></footer>
</main>
<div th:replace="~{fragments :: avisos}"></div>
<script th:src="@{/script.js}"></script>
</body>
</html>
