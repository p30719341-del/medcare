<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MedCare | Crear cuenta</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232864e8'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E"><link rel="stylesheet" th:href="@{/styles.css}"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2864e8"><link rel="apple-touch-icon" href="/img/icon-192.png"><script>(function(){var R=document.documentElement;try{var t=localStorage.getItem('medcare-tema');if(t)R.setAttribute('data-theme',t)}catch(e){}function sync(){var d=R.getAttribute('data-theme')==='dark';var b=document.querySelectorAll('[data-theme-toggle]');for(var i=0;i<b.length;i++){b[i].setAttribute('aria-pressed',String(d));var s=b[i].querySelector('span');if(s)s.textContent=d?'Modo claro':'Modo oscuro'}}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-theme-toggle]');if(!b)return;var n=R.getAttribute('data-theme')==='dark'?'light':'dark';R.setAttribute('data-theme',n);try{localStorage.setItem('medcare-tema',n)}catch(x){}sync()});document.addEventListener('DOMContentLoaded',sync)})()</script></head>
<body>
<a class="skip" href="#contenido">Saltar al contenido</a>
<section class="auth-form solo-page" id="contenido">
  <form class="dialog solo" th:action="@{/registro}" th:object="${form}" method="post" novalidate>
    <div class="brand"><b>✚</b><span><strong>MedCare</strong><small>Gestión clínica</small></span></div>
    <small class="kicker">NUEVO PACIENTE</small>
    <h2>Crea tu cuenta</h2>
    <p class="notice">Con tu cuenta reservas, cambias y cancelas tus citas, y ves tu historial y tus recetas. Usa datos ficticios: es una maqueta académica.</p>
    <div class="alert" role="alert" th:each="e : ${errores}" th:text="${e}">Error</div>

    <label for="nombre">Nombre completo
      <input th:field="*{nombre}" th:classappend="${#fields.hasErrors('nombre')} ? 'invalid'" autocomplete="name" autofocus>
      <small class="err" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small></label>
    <label for="dni">DNI (será tu usuario)
      <input th:field="*{dni}" th:classappend="${#fields.hasErrors('dni')} ? 'invalid'" maxlength="8" inputmode="numeric" autocomplete="off">
      <small class="err" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></small></label>
    <label for="telefono">Teléfono
      <input th:field="*{telefono}" th:classappend="${#fields.hasErrors('telefono')} ? 'invalid'" type="tel" autocomplete="tel">
      <small class="err" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></small></label>
    <label for="email">Correo
      <input th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'invalid'" type="email" autocomplete="email">
      <small class="err" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small></label>
    <label for="clave">Contraseña
      <input id="clave" name="clave" type="password" required minlength="8" autocomplete="new-password"></label>
    <small class="hint">Mínimo 8 caracteres, con al menos una letra y un número.</small>
    <label for="confirmar">Repite la contraseña
      <input id="confirmar" name="confirmar" type="password" required minlength="8" autocomplete="new-password"></label>
    <button class="primary">Crear cuenta</button>
    <p class="back"><a th:href="@{/login}">← Ya tengo cuenta</a></p>
  </form>
</section>
<script th:src="@{/script.js}"></script>
</body>
</html>
