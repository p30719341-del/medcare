# Perfil "mysql": usa MySQL 8 en tu PC (usuario root). La base "medcare" se crea sola.
#   mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Clave de MySQL sin editar archivos (Windows CMD):  set MYSQL_PASSWORD=mi_clave && mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/medcare?createDatabaseIfNotExist=true&serverTimezone=America/Lima&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
