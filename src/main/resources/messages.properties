faq.1a=Queda como <b>Pendiente</b> hasta que la clínica la confirme. Puedes ver el estado en tu portal de paciente.
faq.2a=Ingresa a <b>Acceso pacientes</b> con tu DNI como usuario. Si es tu primera reserva, tu clave inicial es tu mismo DNI y el sistema te pedirá cambiarla.
faq.3a=Cada doctor tiene sus propios días y horas (los ves en su tarjeta). Al elegir doctor y fecha solo aparecen los turnos libres.
faq.4a=Sí. Desde tu portal de paciente puedes reprogramarla o cancelarla hasta 2 horas antes. Si dejaste tu correo, te avisamos del cambio.
faq.5a=Desde 1 hora antes de la cita y hasta 30 días hacia adelante.
faq.6a=No. MedCare es una maqueta académica: los doctores, pacientes y citas son ficticios. No ingreses datos personales reales.
