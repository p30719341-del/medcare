# Perfil "prod" para publicar en internet:  SPRING_PROFILES_ACTIVE=prod
# Base de datos: o bien DB_URL completo (jdbc:postgresql://... o jdbc:mysql://...), o las partes DB_HOST / DB_PORT / DB_NAME.
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:medcare}}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.thymeleaf.cache=true
# La cookie de sesión solo viaja por HTTPS
server.servlet.session.cookie.secure=true
# Si dejas medcare.base-url sin configurar, los QR apuntarían a localhost: define BASE_URL con tu dirección pública
